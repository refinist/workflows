name: Release

on:
  workflow_call:
    inputs:
      changelogithub:
        description: 'Whether to let GitHub generate the changelog. Note: GITHUB_TOKEN needs to be configured.'
        required: false
        type: boolean
        default: true

      build:
        description: "The command to build the project. If your project already has 'prepublishOnly': 'pnpm run build' configured, you can skip this."
        required: false
        type: string
        default: ''

      publish:
        description: Whether to publish to NPM
        required: false
        type: boolean
        default: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Setup Env
        uses: refinist/workflows/setup-env@v1

      - name: Generate GitHub Changelog
        run: pnpx changelogithub
        continue-on-error: true
        if: ${{ inputs.changelogithub }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: ${{ inputs.build }}
        if: ${{ inputs.build && inputs.publish }}

      - name: Publish to NPM
        run: pnpm -r publish --access public --no-git-checks
        if: ${{ inputs.publish }}
